name: Contribution snake

# The activity graph used to come from a third-party host that went dark (HTTP 402).
# Generate it here instead and commit it to the `output` branch, so the README only
# ever points at this repo.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Quoted: the '#' in the hex colours would otherwise start a YAML comment.
          # Palette matches assets/ascii.svg — cream snake, gold contribution ramp.
          outputs: "dist/snake.svg?color_snake=#f5f2ea&color_dots=#1a1a1f,#4a3708,#8a6710,#c08e0e,#e0a30c"

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
